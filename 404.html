<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <script>
    // Redirect any old /mdl/ path to the main site
    var path = window.location.pathname;
    if (path.indexOf('/mdl') !== -1) {
      window.location.replace('https://billjobs.it');
    } else {
      window.location.replace('https://billjobs.it');
    }
  </script>
</head>
<body></body>
</html>

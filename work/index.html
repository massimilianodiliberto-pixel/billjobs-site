    /* ── BUILD CARDS ─────────────────────────────────────────── */

    function buildCard(p) {
      if (p.type === 'statement') {
        const el = document.createElement('div');
        el.className = 'wk-statement' + (p.pos === 'open' ? ' wk-statement--open' : ' wk-statement--close');
        el.dataset.cat = p.cat;
        el.innerHTML = '<p class="wk-statement-text">' + p.text + '</p>' +
          (p.sub ? '<p class="wk-statement-sub">' + p.sub + '</p>' : '');
        return el;
      }
      if (p.type === 'word') {
        const el = document.createElement('div');
        el.className = 'wk-word';
        el.dataset.cat = p.cat;
        el.innerHTML = '<span class="wk-word-text">' + p.text + '</span>';
        return el;
      }
      const el = document.createElement('article');
      el.className = 'wk-card' +
        (p.size === 'wide'     ? ' wk-wide'     : '') +
        (p.size === 'portrait' ? ' wk-portrait' : '');
      el.dataset.cat = p.cat;
      el.dataset.id  = p.id;

      const hasVideo = p.action !== 'image_only';

      el.innerHTML =
        '<div class="wk-media">' +
          ((p.thumb || p.image)
            ? `<img src="${p.thumb || p.image}" alt="${p.title}" loading="lazy">`
            : '<div class="wk-placeholder"><span>' + p.title + '</span></div>') +
          (hasVideo ? '<div class="wk-play"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg></div>' : '') +
        '</div>' +
        '<div class="wk-info">' +
          '<span class="wk-cat-tag">' + p.catLabel + '</span>' +
          '<h3 class="wk-title">' + p.title + '</h3>' +
          '<span class="wk-role">' + p.role + '</span>' +
        '</div>';

      el.addEventListener('click', () => openOverlay(p));
      return el;
    }

    const grid = document.getElementById('wk-grid');
    PROJECTS.forEach(p => grid.appendChild(buildCard(p)));

    /* ── HOVER ───────────────────────────────────────────────── */

    grid.querySelectorAll('.wk-card').forEach(card => {
      const info = card.querySelector('.wk-info');
      const img  = card.querySelector('img');
      card.addEventListener('mouseenter', () => {
        gsap.to(info, { opacity: 1, y: 0,    duration: 0.38, ease: 'power2.out' });
        if (img) gsap.to(img, { scale: 1.04, duration: 0.9,  ease: 'power2.out' });
      });
      card.addEventListener('mouseleave', () => {
        gsap.to(info, { opacity: 0.72, y: 0, duration: 0.32 });
        if (img) gsap.to(img, { scale: 1,    duration: 0.7,  ease: 'power2.out' });
      });
    });

    /* ── FILTER ──────────────────────────────────────────────── */

    function showAll() {
      document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
      grid.querySelectorAll('.wk-card').forEach(card => {
        card.style.display = '';
        gsap.to(card, { opacity: 1, duration: 0.35, ease: 'power2.out' });
      });
      grid.querySelectorAll('.wk-statement').forEach(stmt => {
        stmt.style.display = 'none';
      });
      grid.querySelectorAll('.wk-word').forEach(w => {
        w.style.display = 'none';
      });
    }

    document.getElementById('work-filters').addEventListener('click', e => {
      const btn = e.target.closest('.filter');
      if (!btn) return;
      if (btn.classList.contains('active')) { showAll(); return; }
      document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      if (f === 'all') { showAll(); return; }
      grid.querySelectorAll('.wk-card, .wk-statement, .wk-word').forEach(card => {
        const show = card.dataset.cat === f;
        if (show) {
          card.style.display = '';
          gsap.to(card, { opacity: 1, duration: 0.35, ease: 'power2.out' });
        } else {
          gsap.to(card, { opacity: 0, duration: 0.25, ease: 'power2.in',
            onComplete: () => { card.style.display = 'none'; }
          });
        }
      });
      setTimeout(function() { updateCardZoom(); }, 350);
    });

    /* ── OVERLAY ─────────────────────────────────────────────── */

    const ov = document.getElementById('wk-overlay');
    var _ovPending = null;
    var _ovOpen    = false;

    function openOverlay(p) {
      if (_ovPending) { clearTimeout(_ovPending); _ovPending = null; }

      const panel = ov.querySelector('.wk-ov-panel');
      panel.dataset.skin = p.skin || '';

      ov.querySelector('.wk-ov-cat').textContent   = p.catLabel;
      ov.querySelector('.wk-ov-role').textContent  = p.role;
      ov.querySelector('.wk-ov-title').textContent = p.title;

      const descEl = ov.querySelector('.wk-ov-desc');
      if (p.skin === 'film-dossier') {
        let html = '';
        if (p.subtitle) html += '<p class="wk-ov-subtitle">' + p.subtitle + '</p>';
        if (p.intro)    html += '<p class="wk-ov-intro">' + p.intro + '</p>';
        if (p.statements && p.statements.length) {
          html += '<div class="wk-film-stmts">';
          p.statements.forEach(function (s) { html += '<p class="wk-film-stmt">' + s + '</p>'; });
          html += '</div>';
        }
        descEl.innerHTML = html;
      } else {
        descEl.textContent = p.desc;
      }

      const media = ov.querySelector('.wk-ov-media');
      media.innerHTML = '';

      if (p.action === 'link_youtube' && p.youtube) {
        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${p.youtube}?autoplay=1&rel=0&modestbranding=1`;
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        media.appendChild(iframe);
      } else if (p.action === 'link_video' && p.video) {
        const vid = document.createElement('video');
        vid.src = p.video; vid.controls = true; vid.autoplay = true; vid.setAttribute('playsinline', '');
        media.appendChild(vid);
      } else if (p.image) {
        const img = document.createElement('img');
        img.src = p.image; img.alt = p.title;
        media.appendChild(img);
      } else {
        media.innerHTML = '<div class="wk-ov-empty"><span>' + p.title + '</span></div>';
      }

      _ovOpen = true;
      ov.setAttribute('aria-hidden', 'false');
      ov.classList.add('active');
      document.body.style.overflow = 'hidden';
      if (typeof lenis !== 'undefined') lenis.stop();
      gsap.killTweensOf('main, nav');
      gsap.to('main, nav', { filter: 'blur(4px)', duration: 0.35, ease: 'power1.out' });
    }

    function closeOverlay() {
      if (!_ovOpen) return;
      _ovOpen = false;
      ov.classList.remove('active');
      ov.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      if (typeof lenis !== 'undefined') lenis.start();
      gsap.killTweensOf('main, nav');
      gsap.to('main, nav', { filter: 'blur(0px)', duration: 0.35, ease: 'power1.out' });
      /* Restore card info smoothly — fires while overlay is still fading, so no visible jump */
      document.querySelectorAll('.wk-info').forEach(function(info) {
        gsap.killTweensOf(info);
        gsap.to(info, { opacity: 0.72, y: 0, duration: 0.22, ease: 'none' });
      });
      /* Clean up media after CSS transition finishes */
      _ovPending = setTimeout(function() {
        _ovPending = null;
        ov.querySelector('.wk-ov-media').innerHTML = '';
        ov.querySelector('.wk-ov-panel').dataset.skin = '';
      }, 560);
    }

    ov.querySelector('.wk-ov-close').addEventListener('click', closeOverlay);
    ov.querySelector('.wk-ov-backdrop').addEventListener('click', closeOverlay);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });

    /* ── DEFAULT FILTER: BEAUTY & FASHION ───────────────────── */
    (function () {
      var defaultFilter = 'beauty-fashion';
      var defaultBtn = document.querySelector('.filter[data-filter="' + defaultFilter + '"]');
      if (defaultBtn) defaultBtn.classList.add('active');
      document.querySelectorAll('.wk-card, .wk-statement').forEach(function (card) {
        if (card.dataset.cat !== defaultFilter) {
          card.style.display = 'none';
          card.style.opacity = '0';
        }
      });
    }());

    /* ── ENTRANCE — staged, subdued ─────────────────────────── */

    gsap.set('.filter', { opacity: 0 });

    var entranceTL = gsap.timeline({ delay: 0.08 });
    entranceTL
      .fromTo('#work-title',
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 1.9, ease: 'power1.out' }
      )
      .fromTo('#work-subtitle',
        { opacity: 0 },
        { opacity: 1, duration: 1.2, ease: 'power1.out' },
        '-=1.0'
      )
      .fromTo('.work-tagline',
        { opacity: 0 },
        { opacity: 1, duration: 1.0, ease: 'power1.out' },
        '-=0.8'
      )
      .to('.filter',
        { opacity: 1, duration: 0.8, ease: 'power1.out', stagger: 0.14 },
        '-=0.5'
      )
      .fromTo('.wk-card:not([style*="display: none"])',
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.85, ease: 'power1.out', stagger: { amount: 0.55 } },
        '-=0.25'
      );

    /* Title light pulse */
    gsap.to('#work-title', {
      textShadow: '0 0 48px rgba(255,255,255,0.16)',
      duration: 4.5,
      yoyo: true,
      repeat: -1,
      ease: 'sine.inOut',
      delay: 2.2
    });

    /* Continuous floating animation on title */
    gsap.to('#work-title', {
      y: -10, x: 5,
      duration: 6,
      yoyo: true,
      repeat: -1,
      ease: 'sine.inOut',
      delay: 2.0
    });

    /* Card center zoom on scroll */
    (function () {
      function updateCardZoom() {
        var vcenter = window.innerHeight / 2;
        /* Desktop: base 0.88 so max zoom (~0.95) never exceeds grid cell → no overlap */
        var base = window.innerWidth >= 768 ? 0.88 : 1.0;
        document.querySelectorAll('.wk-card').forEach(function(card) {
          if (card.style.display === 'none') {
            card.style.transform = '';
            return;
          }
          var r = card.getBoundingClientRect();
          var ic = r.top + r.height / 2;
          var dist = Math.abs(ic - vcenter);
          var maxDist = window.innerHeight * 0.58;
          var t = Math.max(0, 1 - dist / maxDist);
          card.style.transform = 'scale(' + (base + t * 0.070).toFixed(4) + ')';
        });
      }
      if (typeof lenis !== 'undefined') {
        lenis.on('scroll', updateCardZoom);
      } else {
        window.addEventListener('scroll', updateCardZoom, { passive: true });
      }
    }());

  </script>

  <!-- WORK VIDEO + AUDIO LAYER -->
  <script>
  (function () {

    /* ── Distortion flash video for overlay open ── */
    var wvf = document.createElement('video');
    wvf.id = 'vid-work-flash'; wvf.muted = true; wvf.playsInline = true;
    wvf.preload = 'none'; wvf.loop = false;
    var wvs = document.createElement('source');
    wvs.src = '../assets/video/Distortion%20Transition%204.mp4'; wvs.type = 'video/mp4';
    wvf.appendChild(wvs); document.body.appendChild(wvf);

    function triggerWorkFlash () {
      wvf.currentTime = 0;
      wvf.load();
      wvf.play().catch(function(){});
      gsap.fromTo(wvf, { opacity: 0 }, { opacity: 0.35, duration: 0.10, ease: 'power2.out',
        onComplete: function () {
          gsap.to(wvf, { opacity: 0, duration: 0.55, delay: 0.20, ease: 'power2.in',
            onComplete: function () { wvf.pause(); }
          });
        }
      });
    }

    /* ── Overlay open: watch for active class ── */
    var wkOv = document.getElementById('wk-overlay');
    if (wkOv) {
      new MutationObserver(function (muts) {
        muts.forEach(function (m) {
          if (m.attributeName === 'class' && wkOv.classList.contains('active')) {
            triggerWorkFlash();
            window.sound.playShort('woosh', 0.04, 500);
            window.sound.play('distortion-fade', 0.05, 0.18);
          }
        });
      }).observe(wkOv, { attributes: true });
    }

    /* ── Card hover: hiss on mouseenter ── */
    var wkGrid = document.getElementById('wk-grid');
    if (wkGrid) {
      wkGrid.addEventListener('mouseenter', function (e) {
        if (e.target.closest('.wk-card')) {
          window.sound.play('hiss', 0.04, 0.10);
        }
      }, true);
    }

    window.addEventListener('load', function () {
      /* Work page is mostly silent — no ambient loop */
    });

  }());
  </script>

    /* ── BUILD CARDS ─────────────────────────────────────────── */

    function buildCard(p) {
      const el = document.createElement('article');
      el.className = 'wk-card' +
        (p.size === 'wide'     ? ' wk-wide'     : '') +
        (p.size === 'portrait' ? ' wk-portrait' : '');
      el.dataset.cat = p.cat;
      el.dataset.id  = p.id;

      const hasVideo = p.action !== 'image_only';

      el.innerHTML =
        '<div class="wk-media">' +
          (p.image
            ? `<img src="${p.image}" alt="${p.title}" loading="lazy">`
            : '<div class="wk-placeholder"><span>' + p.title + '</span></div>') +
          (hasVideo ? '<div class="wk-play"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg></div>' : '') +
        '</div>' +
        '<div class="wk-info">' +
          '<span class="wk-cat-tag">' + p.catLabel + '</span>' +
          '<h3 class="wk-title">' + p.title + '</h3>' +
          '<span class="wk-role">' + p.role + '</span>' +
        '</div>';

      el.addEventListener('click', () => openOverlay(p));
      return el;
    }

    const grid = document.getElementById('wk-grid');
    PROJECTS.forEach(p => grid.appendChild(buildCard(p)));

    /* ── HOVER ───────────────────────────────────────────────── */

    grid.querySelectorAll('.wk-card').forEach(card => {
      const info = card.querySelector('.wk-info');
      const img  = card.querySelector('img');
      card.addEventListener('mouseenter', () => {
        gsap.to(info, { opacity: 1, y: 0,    duration: 0.38, ease: 'power2.out' });
        if (img) gsap.to(img, { scale: 1.04, duration: 0.9,  ease: 'power2.out' });
      });
      card.addEventListener('mouseleave', () => {
        gsap.to(info, { opacity: 0, y: 8,    duration: 0.32 });
        if (img) gsap.to(img, { scale: 1,    duration: 0.7,  ease: 'power2.out' });
      });
    });

    /* ── FILTER ──────────────────────────────────────────────── */

    function showAll() {
      document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
      grid.querySelectorAll('.wk-card').forEach(card => {
        card.style.display = '';
        gsap.to(card, { opacity: 1, duration: 0.35, ease: 'power2.out' });
      });
    }

    document.getElementById('work-title').addEventListener('click', showAll);

    document.getElementById('work-filters').addEventListener('click', e => {
      const btn = e.target.closest('.filter');
      if (!btn) return;
      if (btn.classList.contains('active')) { showAll(); return; }
      document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      grid.querySelectorAll('.wk-card').forEach(card => {
        const show = card.dataset.cat === f;
        if (show) {
          card.style.display = '';
          gsap.to(card, { opacity: 1, duration: 0.35, ease: 'power2.out' });
        } else {
          gsap.to(card, { opacity: 0, duration: 0.25, ease: 'power2.in',
            onComplete: () => { card.style.display = 'none'; }
          });
        }
      });
    });

    /* ── OVERLAY ─────────────────────────────────────────────── */

    const ov = document.getElementById('wk-overlay');

    function openOverlay(p) {
      const panel = ov.querySelector('.wk-ov-panel');
      panel.dataset.skin = p.skin || '';

      ov.querySelector('.wk-ov-cat').textContent   = p.catLabel;
      ov.querySelector('.wk-ov-role').textContent  = p.role;
      ov.querySelector('.wk-ov-title').textContent = p.title;

      const descEl = ov.querySelector('.wk-ov-desc');
      if (p.skin === 'film-dossier') {
        let html = '';
        if (p.subtitle) html += '<p class="wk-ov-subtitle">' + p.subtitle + '</p>';
        if (p.intro)    html += '<p class="wk-ov-intro">' + p.intro + '</p>';
        if (p.statements && p.statements.length) {
          html += '<div class="wk-film-stmts">';
          p.statements.forEach(function (s) { html += '<p class="wk-film-stmt">' + s + '</p>'; });
          html += '</div>';
        }
        descEl.innerHTML = html;
      } else {
        descEl.textContent = p.desc;
      }

      const media = ov.querySelector('.wk-ov-media');
      media.innerHTML = '';

      if (p.action === 'link_youtube' && p.youtube) {
        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${p.youtube}?autoplay=1&rel=0&modestbranding=1`;
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        media.appendChild(iframe);
      } else if (p.action === 'link_video' && p.video) {
        const vid = document.createElement('video');
        vid.src = p.video; vid.controls = true; vid.autoplay = true; vid.setAttribute('playsinline', '');
        media.appendChild(vid);
      } else if (p.image) {
        const img = document.createElement('img');
        img.src = p.image; img.alt = p.title;
        media.appendChild(img);
      } else {
        media.innerHTML = '<div class="wk-ov-empty"><span>' + p.title + '</span></div>';
      }

      ov.setAttribute('aria-hidden', 'false');
      ov.classList.add('active');
      document.body.style.overflow = 'hidden';
      if (typeof lenis !== 'undefined') lenis.stop();
      gsap.to('main, nav', { filter: 'blur(4px)', duration: 0.4, ease: 'power2.out' });
    }

    function closeOverlay() {
      ov.classList.remove('active');
      ov.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      if (typeof lenis !== 'undefined') lenis.start();
      gsap.to('main, nav', { filter: 'blur(0px)', duration: 0.4, ease: 'power2.out' });
      setTimeout(() => {
        ov.querySelector('.wk-ov-media').innerHTML = '';
        ov.querySelector('.wk-ov-panel').dataset.skin = '';
      }, 600);
    }

    ov.querySelector('.wk-ov-close').addEventListener('click', closeOverlay);
    ov.querySelector('.wk-ov-backdrop').addEventListener('click', closeOverlay);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });

    /* ── ENTRANCE ────────────────────────────────────────────── */

    gsap.fromTo('.wk-card',
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out',
        stagger: { amount: 0.5 }, delay: 0.15 }
    );

  </script>

  <!-- WORK VIDEO + AUDIO LAYER -->
  <script>
  (function () {

    /* ── Distortion flash video for overlay open ── */
    var wvf = document.createElement('video');
    wvf.id = 'vid-work-flash'; wvf.muted = true; wvf.playsInline = true;
    wvf.preload = 'none'; wvf.loop = false;
    var wvs = document.createElement('source');
    wvs.src = '../assets/video/Distortion%20Transition%204.mp4'; wvs.type = 'video/mp4';
    wvf.appendChild(wvs); document.body.appendChild(wvf);

    function triggerWorkFlash () {
      wvf.currentTime = 0;
      wvf.load();
      wvf.play().catch(function(){});
      gsap.fromTo(wvf, { opacity: 0 }, { opacity: 0.35, duration: 0.10, ease: 'power2.out',
        onComplete: function () {
          gsap.to(wvf, { opacity: 0, duration: 0.55, delay: 0.20, ease: 'power2.in',
            onComplete: function () { wvf.pause(); }
          });
        }
      });
    }

    /* ── Overlay open: watch for active class ── */
    var wkOv = document.getElementById('wk-overlay');
    if (wkOv) {
      new MutationObserver(function (muts) {
        muts.forEach(function (m) {
          if (m.attributeName === 'class' && wkOv.classList.contains('active')) {
            triggerWorkFlash();
            window.sound.playShort('woosh', 0.04, 500);
            window.sound.play('distortion-fade', 0.05, 0.18);
          }
        });
      }).observe(wkOv, { attributes: true });
    }

    /* ── Card hover: hiss on mouseenter ── */
    var wkGrid = document.getElementById('wk-grid');
    if (wkGrid) {
      wkGrid.addEventListener('mouseenter', function (e) {
        if (e.target.closest('.wk-card')) {
          window.sound.play('hiss', 0.04, 0.10);
        }
      }, true);
    }

    window.addEventListener('load', function () {
      document.addEventListener('sound:enabled', function () {
        console.log('[Sound/Work] sound:enabled → hiss loop');
        window.sound.loop('hiss', 0.12);
      });
    });

  }());
  </script>

  <!-- GAMMA+ CAMPAIGN SLIDESHOW -->
  <script>
  (function () {
    var SLIDES = [
      '../assets/img/G+C01.jpg',
      '../assets/img/G+C03.jpg',
      '../assets/img/G+C04.jpg',
      '../assets/img/G+C06.jpg',
      '../assets/img/G+C07.jpg',
      '../assets/img/G+C08.jpg',
      '../assets/img/G+C09.jpg'
    ];
    var INTERVAL = 3500;
    var FADE     = 1000;

    function initSlideshow () {
      var card = document.querySelector('.wk-card[data-id="gamma-campagne"]');
      if (!card) return;
      var media = card.querySelector('.wk-media');
      if (!media) return;

      /* Build two stacked <img> layers for cross-fade */
      var imgA = document.createElement('img');
      var imgB = document.createElement('img');
      imgA.alt = imgB.alt = 'Gamma+ Campaign';
      imgA.setAttribute('loading', 'lazy');
      imgB.setAttribute('loading', 'lazy');
      imgA.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity ' + (FADE / 1000) + 's ease;opacity:1;';
      imgB.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity ' + (FADE / 1000) + 's ease;opacity:0;';
      media.style.position = 'relative';
      /* Remove existing img */
      var existing = media.querySelector('img');
      if (existing) existing.remove();
      media.prepend(imgB);
      media.prepend(imgA);

      imgA.src = SLIDES[0];

      var current = 0;
      var active  = imgA;
      var passive = imgB;
      var timer   = null;

      function advance () {
        current = (current + 1) % SLIDES.length;
        passive.src = SLIDES[current];
        passive.onload = function () {
          active.style.opacity  = '0';
          passive.style.opacity = '1';
          var tmp = active; active = passive; passive = tmp;
        };
      }

      function startSlide () {
        if (timer) return;
        timer = setInterval(advance, INTERVAL);
      }
      function stopSlide () {
        clearInterval(timer);
        timer = null;
      }

      new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) { startSlide(); }
        else { stopSlide(); }
      }, { threshold: 0.1 }).observe(card);
    }

    /* Cards are built by the PROJECTS loop; wait for it */
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSlideshow);
    } else {
      initSlideshow();
    }
  }());
  </script>

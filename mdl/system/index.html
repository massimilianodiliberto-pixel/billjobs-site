  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>
  <script src="../assets/js/core.js"></script>

  <script>
  (function () {
    var canvas = document.getElementById('system-canvas');
    var ctx = canvas.getContext('2d');
    var W, H, orbits = [], nodes = [], words = [], vignette = null;
    var mx = 0, my = 0, tmx = 0, tmy = 0;
    var fontsReady = false, frame = 0;

    document.fonts.ready.then(function () { fontsReady = true; });

    var ORBIT_DEFS = [
      { raF: 0.30, rbF: 0.40, tilt:  0.28, speed:  0.000160 },
      { raF: 0.18, rbF: 0.26, tilt: -0.42, speed: -0.000220 },
      { raF: 0.38, rbF: 0.24, tilt:  0.68, speed:  0.000135 },
    ];

    var ANCHOR_DEF = [
      { oi: 0, phase: -1.20, r: 4.8, op: 0.72, label: 'DIRECTION'  },
      { oi: 0, phase:  0.52, r: 4.2, op: 0.65, label: 'PRODUCTION' },
      { oi: 0, phase:  2.50, r: 4.5, op: 0.68, label: 'EXPERIENCE' },
      { oi: 1, phase:  0.90, r: 5.2, op: 0.76, label: 'CREATIVE'   },
      { oi: 1, phase:  3.40, r: 3.8, op: 0.60, label: 'VISION'     },
      { oi: 2, phase:  1.10, r: 4.5, op: 0.68, label: 'STRATEGY'   },
      { oi: 2, phase:  3.70, r: 4.0, op: 0.62, label: 'POST'       },
      { oi: 2, phase: -0.60, r: 3.5, op: 0.58, label: 'BUDGET'     },
    ];

    var WORD_LIST = [
      'VISION','BUDGET','PEOPLE','TIME','LIMITS',
      'PERMITS','SET','PRESSURE','POST','DELIVERY',
      'BALANCE','EXECUTION','PRECISION','REALITY'
    ];

    function resize() {
      W = canvas.width = canvas.offsetWidth;
      H = canvas.height = canvas.offsetHeight;
      vignette = null;
      build();
    }

    function build() {
      var cx = W * 0.625;
      var cy = H * 0.500;
      orbits = ORBIT_DEFS.map(function (d) {
        return { cx: cx, cy: cy, ra: W * d.raF, rb: H * d.rbF, tilt: d.tilt, speed: d.speed };
      });
      nodes = [];
      ANCHOR_DEF.forEach(function (d) {
        nodes.push({
          type: 'orbit', orb: orbits[d.oi],
          angle: d.phase, speed: orbits[d.oi].speed,
          r: d.r, op: d.op, label: d.label, anchor: true, x: 0, y: 0
        });
      });
      for (var i = 0; i < 10; i++) {
        var orb = orbits[i % 3];
        nodes.push({
          type: 'orbit', orb: orb,
          angle: Math.random() * Math.PI * 2,
          speed: orb.speed * (0.65 + Math.random() * 0.70),
          r: Math.random() * 0.9 + 0.5,
          op: Math.random() * 0.12 + 0.06,
          label: null, anchor: false, x: 0, y: 0
        });
      }
      words = WORD_LIST.map(function (text, i) {
        return {
          text: text,
          x: W * (0.10 + Math.random() * 0.80),
          y: H * (0.08 + Math.random() * 0.84),
          vx: (Math.random() - 0.5) * 0.07,
          vy: (Math.random() - 0.5) * 0.05,
          phase: (i / WORD_LIST.length) * Math.PI * 2 + Math.random() * 1.2,
          cycleSpeed: 0.00035 + Math.random() * 0.00025,
          maxOp: 0.13 + Math.random() * 0.09,
        };
      });
    }

    function tick() {
      nodes.forEach(function (n) {
        if (n.type === 'orbit') {
          n.angle += n.speed;
          var c = Math.cos(n.orb.tilt), s = Math.sin(n.orb.tilt);
          var ex = Math.cos(n.angle) * n.orb.ra;
          var ey = Math.sin(n.angle) * n.orb.rb;
          n.x = n.orb.cx + ex * c - ey * s;
          n.y = n.orb.cy + ex * s + ey * c;
        }
      });
      words.forEach(function (w) {
        w.x += w.vx;
        w.y += w.vy;
        if (w.x < -90) w.x = W + 90;
        if (w.x > W + 90) w.x = -90;
        if (w.y < -20) w.y = H + 20;
        if (w.y > H + 20) w.y = -20;
      });
    }

    function getVignette() {
      if (vignette) return vignette;
      var g = ctx.createRadialGradient(W / 2, H / 2, H * 0.10, W / 2, H / 2, H * 0.80);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.78)');
      vignette = g;
      return vignette;
    }

    function render() {
      frame++;
      tick();
      ctx.clearRect(0, 0, W, H);

      tmx += (mx - tmx) * 0.038;
      tmy += (my - tmy) * 0.038;

      ctx.save();
      ctx.translate(tmx, tmy);

      orbits.forEach(function (orb) {
        ctx.beginPath();
        ctx.ellipse(orb.cx, orb.cy, orb.ra, orb.rb, orb.tilt, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 0.7;
        ctx.stroke();
      });

      var anchors = nodes.filter(function (n) { return n.anchor; });
      for (var i = 0; i < anchors.length; i++) {
        for (var j = i + 1; j < anchors.length; j++) {
          var a = anchors[i], b = anchors[j];
          var d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 230) {
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255,255,255,' + ((1 - d / 230) * 0.07) + ')';
            ctx.lineWidth = 0.5;
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      if (fontsReady) {
        ctx.font = '300 10px "Space Grotesk", sans-serif';
        ctx.letterSpacing = '0.14em';
        ctx.textAlign = 'left';
        words.forEach(function (w) {
          var op = Math.max(0, Math.sin(frame * w.cycleSpeed + w.phase));
          op = op * op * w.maxOp;
          if (op > 0.005) {
            ctx.fillStyle = 'rgba(255,255,255,' + op.toFixed(3) + ')';
            ctx.fillText(w.text, w.x, w.y);
          }
        });
      }

      nodes.forEach(function (n) {
        if (!n.anchor) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + n.op + ')';
          ctx.fill();
        }
      });

      anchors.forEach(function (n) {
        ctx.shadowColor = 'rgba(255,255,255,0.55)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + n.op + ')';
        ctx.fill();
        ctx.shadowBlur = 0;

        if (fontsReady) {
          var px = n.x > (W * 0.625) ? n.x + n.r + 7 : n.x - n.r - 7;
          ctx.font = '500 9px "Space Grotesk", sans-serif';
          ctx.letterSpacing = '0.12em';
          ctx.fillStyle = 'rgba(255,255,255,0.42)';
          ctx.textAlign = n.x > (W * 0.625) ? 'left' : 'right';
          ctx.fillText(n.label, px, n.y + 3);
        }
      });

      ctx.restore();

      ctx.fillStyle = getVignette();
      ctx.fillRect(0, 0, W, H);

      requestAnimationFrame(render);
    }

    window.addEventListener('mousemove', function (e) {
      mx = (e.clientX / W - 0.5) * 22;
      my = (e.clientY / H - 0.5) * 14;
    });

    window.addEventListener('touchmove', function (e) {
      if (e.touches.length > 0) {
        mx = (e.touches[0].clientX / W - 0.5) * 22;
        my = (e.touches[0].clientY / H - 0.5) * 14;
      }
    }, { passive: true });

    window.addEventListener('resize', resize);

    resize();
    render();
  })();

  window.addEventListener('load', function () {
    gsap.fromTo('#sw1', { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 1.2, ease: 'power2.out', delay: 0.55 });
    gsap.fromTo('#sw2', { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 1.2, ease: 'power2.out', delay: 0.80 });
    gsap.fromTo('#sw3', { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 1.2, ease: 'power2.out', delay: 1.05 });
    gsap.fromTo('#sys-desc', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.0, ease: 'power2.out', delay: 1.40 });
  });
  </script>

</body>

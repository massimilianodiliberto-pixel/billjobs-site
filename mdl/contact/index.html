  <main class="signal-page">

    <!-- Cinematic background -->
    <div class="signal-bg" aria-hidden="true">
      <img src="../assets/img/BCK02.jpg" alt="" class="signal-bg-img">

    <!-- TOP: pulsating title -->

        </svg>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>
  <script src="../assets/js/core.js"></script>

  <script>
(function () {
  window.addEventListener('load', function () {
    /* Animate "Send a Signal" title immediately */
    gsap.fromTo('.signal-send-title',
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 1.4, ease: 'power1.out', delay: 0.2,
        onComplete: function () {
          /* CSS animation handles the pulsation from here */
        }
      }
    );

    var tl = gsap.timeline({ delay: 0.8 });
    tl.fromTo('.signal-email',       { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 1.8, ease: 'power1.out' }, 0)
      .fromTo('.signal-phone',       { opacity: 0 },         { opacity: 1, duration: 1.4, ease: 'power1.out' }, 0.7)
      .fromTo('.signal-instagram',   { opacity: 0 },         { opacity: 1, duration: 1.2, ease: 'power1.out' }, 1.1)
      .fromTo('.signal-tagline-solo', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 2.0, ease: 'power1.out' }, 1.6)
      .fromTo('.signal-bj-logo',     { opacity: 0 },         { opacity: 1, duration: 2.4, ease: 'power1.out' }, 2.4);

    /* glowing pulse on logo after fade-in */
    setTimeout(function () {
      gsap.to('.signal-bj-logo', {
        keyframes: [
          { opacity: 0.68, filter: 'brightness(0.9) drop-shadow(0 0 12px rgba(184,168,152,0.12))', duration: 1.9 },
          { opacity: 0.92, filter: 'brightness(1.0) drop-shadow(0 0 28px rgba(184,168,152,0.28))', duration: 1.9 }
        ],
        repeat: -1, yoyo: false, ease: 'sine.inOut'
      });
    }, 5000);
  });

  document.addEventListener('sound:enabled', function () {
    window.sound.loop('hum', 0.08);
  });
  if (window.sound && window.sound.enabled) {
    window.sound.loop('hum', 0.08);
  }
}());
  </script>

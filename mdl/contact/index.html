</head>
<body>

    </div>
    <button class="nav-toggle" aria-label="Menu">MENU</button>
  </nav>

  <div id="mobile-menu">
    <video class="menu-video" muted loop playsinline preload="none">
      <source src="../assets/img/Hero.mp4" type="video/mp4">
    </video>
    <div class="menu-video-overlay"></div>
    <a href="../index.html">FRAME</a>
    <a href="../work/index.html">WORK</a>
    <a href="../about/index.html">AUTHOR</a>
    <a href="../system/index.html">SYSTEM</a>
  </div>

  <main class="signal-page">

    <!-- Cinematic background -->
    <div class="signal-bg" aria-hidden="true">
      <img src="../assets/img/BCK02.jpg" alt="" class="signal-bg-img">
      <div class="signal-bg-overlay"></div>
    </div>

    <!-- TOP: pulsating title -->
    <div class="signal-top-header">
      <h1 class="signal-send-title">Send a Signal.</h1>
    </div>

    <!-- CENTER: focal point -->
    <div class="signal-center">
      <a href="mailto:massimiliano.diliberto@gmail.com" class="signal-email">
        massimiliano.diliberto@gmail.com
      </a>
      <p class="signal-phone">+39 333 463 9596</p>
      <a href="https://www.instagram.com/billjobs_production?igsh=dWF2emcxN3JoZWs2&utm_source=qr"
         class="signal-instagram" target="_blank" rel="noopener" aria-label="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="3.5"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </div>

    <!-- BOTTOM: logo with tagline overlaid at bottom -->
    <div class="signal-bottom">
      <div class="frame-logo-bill-jobs">
        <img src="../assets/img/Bill%20jobs%20%20logo.jpg" alt="Bill Jobs" class="signal-logo">
        <p class="signal-tagline">Dietro ogni fotogramma,<br>c'è un segnale.</p>
      </div>
    </div>

  </main>

  <footer>
    <span>© 2026 Massimiliano Di Liberto &nbsp;·&nbsp; Bill Jobs Studio</span>
    <a href="mailto:massimiliano.diliberto@gmail.com">massimiliano.diliberto@gmail.com</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>
  <script src="../assets/js/core.js"></script>

  <script>
(function () {
  window.addEventListener('load', function () {
    /* Animate "Send a Signal" title immediately */
    gsap.fromTo('.signal-send-title',
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 1.4, ease: 'power1.out', delay: 0.2,
        onComplete: function () {
          /* CSS animation handles the pulsation from here */
        }
      }
    );

    var tl = gsap.timeline({ delay: 0.8 });
    tl.fromTo('.signal-email',       { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 1.8, ease: 'power1.out' }, 0)
      .fromTo('.signal-phone',       { opacity: 0 },         { opacity: 1, duration: 1.4, ease: 'power1.out' }, 0.7)
      .fromTo('.signal-instagram',   { opacity: 0 },         { opacity: 1, duration: 1.2, ease: 'power1.out' }, 1.1)
      .fromTo('.frame-logo-bill-jobs', { opacity: 0 },       { opacity: 1, duration: 2.4, ease: 'power1.out' }, 1.6)
      .fromTo('.signal-tagline',     { opacity: 0 },         { opacity: 1, duration: 2.0, ease: 'power1.out' }, 2.4);

    /* slow breathing on logo after it fades in */
    setTimeout(function () {
      gsap.to('.signal-logo', { opacity: 0.72, duration: 5.5, yoyo: true, repeat: -1, ease: 'sine.inOut',
        from: { opacity: 0.96 }
      });
    }, 4500);
  });

  document.addEventListener('sound:enabled', function () {
    window.sound.loop('hum', 0.08);
  });
  if (window.sound && window.sound.enabled) {
    window.sound.loop('hum', 0.08);
  }
}());
  </script>

</body>
</html>
